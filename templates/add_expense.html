
{% extends "base.html" %}

{% block title %}Add Expense | Enterprise ERP{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Add New Expense</h4>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Expense Title</label>
                    <input type="text" name="title" class="form-control"
                           placeholder="Enter expense title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="">Select Category</option>
                        <option value="Office Supplies">Office Supplies</option>
                        <option value="Salary">Salary</option>
                        <option value="Rent">Rent</option>
                        <option value="Electricity">Electricity</option>
                        <option value="Travel">Travel</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Amount (₹)</label>
                    <input type="number" name="amount" class="form-control"
                           placeholder="Enter amount" min="0.01"
                           step="0.01" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control"
                              rows="4"
                              placeholder="Enter expense details"></textarea>
                </div>

                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-primary">
                        Save Expense
                    </button>

                    <a href="{{ url_for('expenses') }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
